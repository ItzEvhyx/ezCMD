tool = "eslint"
name = "ESLint & Prettier"
category = "JavaScript & Web"
order = 8
aliases = ["prettier", "lint", "format"]
draft = true

[[group]]
title = "Everything Linting"

[[group.section]]
title = "ESLint"
aliases = []

[[group.section.command]]
note = "Sets up an ESLint config interactively"
cmd = "npm init @eslint/config@latest"

[[group.section.command]]
note = "Lints the whole project"
cmd = "npx eslint ."

[[group.section.command]]
note = "Fixes problems automatically"
cmd = "npx eslint . --fix"

[[group.section.command]]
note = "Lints one file"
cmd = "npx eslint <file>"

[[group.section.command]]
note = "Fails on any warning"
cmd = "npx eslint . --max-warnings 0"

[[group.section]]
title = "Prettier"
aliases = []

[[group.section.command]]
note = "Installs Prettier"
cmd = "npm install -D prettier"

[[group.section.command]]
note = "Formats every file"
cmd = "npx prettier --write ."

[[group.section.command]]
note = "Checks formatting without changing files"
cmd = "npx prettier --check ."

[[group.section.command]]
note = "Formats one file"
cmd = "npx prettier --write <file>"

[[group.section.command]]
note = "Formats files matching a pattern"
cmd = "npx prettier --write \"src/**/*.{ts,tsx}\""
