tool = "mysql"
name = "MySQL & MariaDB"
category = "Databases"
order = 2
aliases = ["mariadb", "mysqldump"]
draft = false

[[group]]
title = "Everything MySQL"

[[group.section]]
title = "Connect"
aliases = ["connect mysql server", "mysql command line", "connect mariadb"]

[[group.section.command]]
note = "Connects to the server"
cmd = "mysql -u <user> -p"

[[group.section.command]]
note = "Connects to a database"
cmd = "mysql -u <user> -p <database>"

[[group.section.command]]
note = "Connects to a remote server"
cmd = "mysql -h <host> -P <port> -u <user> -p"

[[group.section.command]]
note = "Runs one SQL command and exits"
cmd = "mysql -u <user> -p -e \"<sql>\""

[[group.section]]
title = "Inside mysql"
aliases = ["mysql query", "mysql show tables", "mysql describe table"]

[[group.section.command]]
note = "Lists databases"
cmd = "SHOW DATABASES;"

[[group.section.command]]
note = "Switches to a database"
cmd = "USE <database>;"

[[group.section.command]]
note = "Lists tables"
cmd = "SHOW TABLES;"

[[group.section.command]]
note = "Describes a table"
cmd = "DESCRIBE <table>;"

[[group.section.command]]
note = "Shows the SQL that creates a table"
cmd = "SHOW CREATE TABLE <table>;"

[[group.section.command]]
note = "Quits the mysql client"
cmd = "EXIT;"

[[group.section]]
title = "Users & Databases"
aliases = ["manage mysql users", "create mysql database", "change mysql password"]

[[group.section.command]]
note = "Creates a database"
cmd = "CREATE DATABASE <name>;"

[[group.section.command]]
note = "Creates a user"
cmd = "CREATE USER '<user>'@'localhost' IDENTIFIED BY '<password>';"

[[group.section.command]]
note = "Gives a user full access to a database"
cmd = "GRANT ALL PRIVILEGES ON <db>.* TO '<user>'@'localhost';"

[[group.section.command]]
note = "Reloads the privilege tables"
cmd = "FLUSH PRIVILEGES;"

[[group.section.command]]
note = "Shows a user's permissions"
cmd = "SHOW GRANTS FOR '<user>'@'localhost';"

[[group.section.command]]
note = "Deletes a database"
cmd = "DROP DATABASE <name>;"

[[group.section]]
title = "Backup & Restore"
aliases = ["mysql dump database", "restore mysql backup", "mysql backup file"]

[[group.section.command]]
note = "Exports a database to a SQL file"
cmd = "mysqldump -u <user> -p <database> > <backup.sql>"

[[group.section.command]]
note = "Exports every database"
cmd = "mysqldump -u <user> -p --all-databases > <all.sql>"

[[group.section.command]]
note = "Restores from a SQL file"
cmd = "mysql -u <user> -p <database> < <backup.sql>"
