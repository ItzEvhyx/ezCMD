tool = "git"
name = "Git"
category = "Version Control"
aliases = ["rebase", "submodule", "worktree", "reflog", "git-advanced"]

[[section]]
title   = "Setup & Config"
aliases = ["git config", "set username", "set email", "configure git"]

  [[section.command]]
  cmd  = "git config --global user.name \"<name>\""
  note = "Sets global user name for commits"

  [[section.command]]
  cmd  = "git config --global user.email \"<email>\""
  note = "Sets global email address for commits"

  [[section.command]]
  cmd  = "git config --global init.defaultBranch main"
  note = "Sets default branch name to main"

  [[section.command]]
  cmd  = "git config --list"
  note = "Lists all current git configuration settings"

[[section]]
title   = "Initializing a Repo"
aliases = ["init repo", "start repo", "new project", "create repository", "setup repo"]

  [[section.command]]
  cmd  = "git init"
  note = "Initializes a repo in the current folder"

  [[section.command]]
  cmd  = "git add ."
  note = "Stages all new and changed files"

  [[section.command]]
  cmd  = "git commit -m \"Initial commit\""
  note = "Saves the staged files as the first commit"

  [[section.command]]
  cmd  = "git branch -M main"
  note = "Renames the current branch to main"

  [[section.command]]
  cmd  = "git remote add origin <repo-url>"
  note = "Links the repo to a remote on GitHub"

  [[section.command]]
  cmd  = "git push -u origin main"
  note = "Uploads main and sets it as the upstream"

[[section]]
title   = "Cloning a Repo"
aliases = ["clone repo", "download repo", "checkout repo", "download project"]

  [[section.command]]
  cmd  = "git clone <repo-url>"
  note = "Clones a remote repository into a new folder"

  [[section.command]]
  cmd  = "git clone <repo-url> <folder>"
  note = "Clones a repository into a specified folder"

  [[section.command]]
  cmd  = "git clone --depth 1 <repo-url>"
  note = "Clones only the latest commit for a shallow copy"

[[section]]
title   = "Daily Workflow"
aliases = ["git workflow", "save changes", "commit changes", "push code", "daily work", "git add changes"]

  [[section.command]]
  cmd  = "git status"
  note = "Shows changed, staged, and untracked files"

  [[section.command]]
  cmd  = "git add <file>"
  note = "Stages a specific file for the next commit"

  [[section.command]]
  cmd  = "git add ."
  note = "Stages all modified and new files"

  [[section.command]]
  cmd  = "git commit -m \"<message>\""
  note = "Records staged changes with a descriptive message"

  [[section.command]]
  cmd  = "git pull"
  note = "Fetches and integrates remote changes into current branch"

  [[section.command]]
  cmd  = "git push"
  note = "Uploads local branch commits to the remote repository"

[[section]]
title   = "Branching"
aliases = ["create branch", "switch branch", "manage branches", "new branch", "list branches"]

  [[section.command]]
  cmd  = "git branch"
  note = "Lists all local branches"

  [[section.command]]
  cmd  = "git branch -a"
  note = "Lists both local and remote-tracking branches"

  [[section.command]]
  cmd  = "git switch -c <branch>"
  note = "Creates and switches to a new branch"

  [[section.command]]
  cmd  = "git switch <branch>"
  note = "Switches to an existing branch"

  [[section.command]]
  cmd  = "git merge <branch>"
  note = "Merges specified branch into the current branch"

  [[section.command]]
  cmd  = "git branch -d <branch>"
  note = "Deletes a specified branch safely"

[[section]]
title   = "Remotes"
aliases = ["git remotes", "manage remotes", "add remote", "check remote", "remote repository"]

  [[section.command]]
  cmd  = "git remote -v"
  note = "Displays names and URLs of all configured remotes"

  [[section.command]]
  cmd  = "git remote add <name> <url>"
  note = "Adds a new remote repository connection"

  [[section.command]]
  cmd  = "git remote set-url <name> <url>"
  note = "Changes the URL of an existing remote"

  [[section.command]]
  cmd  = "git remote remove <name>"
  note = "Removes a specified remote connection"

  [[section.command]]
  cmd  = "git fetch <name>"
  note = "Downloads commits and refs from remote without merging"

[[section]]
title   = "Undo & Rollback"
aliases = ["undo commit", "reset hard", "rollback changes", "revert commit", "unstage file", "discard changes"]

  [[section.command]]
  cmd  = "git restore --staged <file>"
  note = "Unstages a file while keeping its changes in working tree"

  [[section.command]]
  cmd  = "git restore <file>"
  note = "Discards uncommitted changes in a working tree file"

  [[section.command]]
  cmd  = "git commit --amend -m \"<message>\""
  note = "Rewrites the most recent commit message"

  [[section.command]]
  cmd  = "git reset --soft HEAD~1"
  note = "Undoes last commit keeping changes staged"

  [[section.command]]
  cmd  = "git reset --hard HEAD~1"
  note = "Discards last commit and all working tree changes"

  [[section.command]]
  cmd  = "git revert <commit>"
  note = "Creates a new commit inverting an earlier commit"

[[section]]
title   = "Stash"
aliases = ["git stash", "save work", "stash changes", "shelve changes", "pop stash"]

  [[section.command]]
  cmd  = "git stash"
  note = "Saves uncommitted changes into a temporary stash"

  [[section.command]]
  cmd  = "git stash list"
  note = "Lists all stashed changesets"

  [[section.command]]
  cmd  = "git stash pop"
  note = "Restores and removes the most recently stashed changes"

  [[section.command]]
  cmd  = "git stash apply"
  note = "Applies the most recent stash without removing it"

  [[section.command]]
  cmd  = "git stash drop"
  note = "Discards the most recent stash from storage"

  [[section.command]]
  cmd  = "git stash clear"
  note = "Removes all stashed changesets from storage"

[[section]]
title   = "Tags"
aliases = ["git tags", "create tag", "release tag", "list tags", "version tag"]

  [[section.command]]
  cmd  = "git tag"
  note = "Lists all tags in the repository"

  [[section.command]]
  cmd  = "git tag -a <tag> -m \"<message>\""
  note = "Creates an annotated tag with a message"

  [[section.command]]
  cmd  = "git push origin <tag>"
  note = "Pushes a specific tag to the remote repository"

  [[section.command]]
  cmd  = "git push origin --tags"
  note = "Pushes all local tags to the remote repository"

  [[section.command]]
  cmd  = "git tag -d <tag>"
  note = "Deletes a tag from the local repository"

[[section]]
title   = "History & Diff"
aliases = ["git log", "git diff", "view commits", "check history", "compare changes", "see changes"]

  [[section.command]]
  cmd  = "git log --oneline --graph"
  note = "Displays commit history as a compact graphical tree"

  [[section.command]]
  cmd  = "git log -n <number>"
  note = "Shows the last N commits in the repository"

  [[section.command]]
  cmd  = "git diff"
  note = "Shows unstaged changes in working tree compared to index"

  [[section.command]]
  cmd  = "git diff --staged"
  note = "Shows staged changes compared to the last commit"

  [[section.command]]
  cmd  = "git show <commit>"
  note = "Inspects metadata and diff of a specific commit"

  [[section.command]]
  cmd  = "git blame <file>"
  note = "Shows author and commit for each line in a file"

[[section]]
title   = "Cleanup & Maintenance"
aliases = ["git cleanup", "clean untracked", "prune branches", "git maintenance", "clean repo"]

  [[section.command]]
  cmd  = "git clean -n"
  note = "Previews untracked files that would be removed"

  [[section.command]]
  cmd  = "git clean -fd"
  note = "Forcibly deletes untracked files and directories"

  [[section.command]]
  cmd  = "git remote prune origin"
  note = "Prunes stale remote-tracking branch references"

  [[section.command]]
  cmd  = "git branch --merged"
  note = "Lists branches already merged into current branch"

  [[section.command]]
  cmd  = "git gc"
  note = "Runs garbage collection and optimizes local repository"

[[section]]
title   = "Finding a Bad Commit (bisect)"
aliases = ["git bisect", "find bug", "binary search commit", "find bad commit", "debug history"]

  [[section.command]]
  cmd  = "git bisect start"
  note = "Begins a binary search to locate a buggy commit"

  [[section.command]]
  cmd  = "git bisect bad"
  note = "Marks the current commit as faulty or broken"

  [[section.command]]
  cmd  = "git bisect good <commit>"
  note = "Marks a known working commit to bound the search"

  [[section.command]]
  cmd  = "git bisect reset"
  note = "Concludes bisect session and returns to original branch"

[[group]]
title = "Rewrite History"

[[group.section]]
title = "Rebase & Edit History"
aliases = ["git rebase branch", "edit git commit history", "autosquash git fixup commits"]

[[group.section.command]]
note = "Replays your commits on top of another branch"
cmd = "git rebase <branch>"

[[group.section.command]]
note = "Edits the last n commits interactively"
cmd = "git rebase -i HEAD~<n>"

[[group.section.command]]
note = "Continues after fixing conflicts"
cmd = "git rebase --continue"

[[group.section.command]]
note = "Cancels the rebase"
cmd = "git rebase --abort"

[[group.section.command]]
note = "Skips the current commit"
cmd = "git rebase --skip"

[[group.section.command]]
note = "Creates a fix for an earlier commit"
cmd = "git commit --fixup <commit>"

[[group.section.command]]
note = "Applies fixup commits automatically"
cmd = "git rebase -i --autosquash <base>"

[[group.section.command]]
note = "Pulls and rebases your commits"
cmd = "git pull --rebase"

[[group.section]]
title = "Amend & Fix Commits"
aliases = ["amend git commit", "fix last git commit", "force push rewritten history"]

[[group.section.command]]
note = "Edits the last commit"
cmd = "git commit --amend"

[[group.section.command]]
note = "Adds staged changes to the last commit"
cmd = "git commit --amend --no-edit"

[[group.section.command]]
note = "Rewrites the last commit message"
cmd = "git commit --amend -m \"<message>\""

[[group.section.command]]
note = "Creates a commit with no changes"
cmd = "git commit --allow-empty -m \"<message>\""

[[group.section.command]]
note = "Undoes commits and keeps the changes staged"
cmd = "git reset --soft HEAD~<n>"

[[group.section.command]]
note = "Safely force-pushes after rewriting history"
cmd = "git push --force-with-lease"

[[group]]
title = "Repositories & Branches"

[[group.section]]
title = "Submodules"
aliases = ["add git submodule", "update git submodules", "initialize recursive git submodules"]

[[group.section.command]]
note = "Adds a repository inside this one"
cmd = "git submodule add <url> <path>"

[[group.section.command]]
note = "Clones a repo with its submodules"
cmd = "git clone --recurse-submodules <url>"

[[group.section.command]]
note = "Fetches submodules after a plain clone"
cmd = "git submodule update --init --recursive"

[[group.section.command]]
note = "Updates submodules to their latest commit"
cmd = "git submodule update --remote"

[[group.section.command]]
note = "Shows each submodule's commit"
cmd = "git submodule status"

[[group.section.command]]
note = "Unregisters a submodule"
cmd = "git submodule deinit -f <path>"

[[group.section]]
title = "Worktrees"
aliases = ["create git worktree", "list git worktrees", "prune deleted git worktrees"]

[[group.section.command]]
note = "Checks out a branch in a new folder"
cmd = "git worktree add <path> <branch>"

[[group.section.command]]
note = "Creates a branch in a new folder"
cmd = "git worktree add -b <new-branch> <path>"

[[group.section.command]]
note = "Lists all worktrees"
cmd = "git worktree list"

[[group.section.command]]
note = "Removes a worktree"
cmd = "git worktree remove <path>"

[[group.section.command]]
note = "Cleans up deleted worktrees"
cmd = "git worktree prune"

[[group.section]]
title = "Branches, Tracking & Cleanup"
aliases = ["prune git remote branches", "set git branch upstream", "track remote git branch"]

[[group.section.command]]
note = "Updates every remote and drops deleted branches"
cmd = "git fetch --all --prune"

[[group.section.command]]
note = "Shows each branch's upstream"
cmd = "git branch -vv"

[[group.section.command]]
note = "Lists remote branches"
cmd = "git branch -r"

[[group.section.command]]
note = "Creates a local branch tracking a remote one"
cmd = "git checkout --track origin/<branch>"

[[group.section.command]]
note = "Pushes a new branch and sets its upstream"
cmd = "git push -u origin <branch>"

[[group.section.command]]
note = "Lists branches already merged"
cmd = "git branch --merged"

[[group.section.command]]
note = "Deletes stale remote-tracking branches"
cmd = "git remote prune origin"

[[group]]
title = "Recovery & Search"

[[group.section]]
title = "Recover Lost Work"
aliases = ["recover lost git commit", "git reflog recovery", "restore deleted git branch"]

[[group.section.command]]
note = "Lists where HEAD has been"
cmd = "git reflog"

[[group.section.command]]
note = "Moves the branch back to a commit"
cmd = "git reset --hard <commit>"

[[group.section.command]]
note = "Creates a branch at a lost commit"
cmd = "git branch <name> <commit>"

[[group.section.command]]
note = "Applies a single commit to this branch"
cmd = "git cherry-pick <commit>"

[[group.section.command]]
note = "Restores a file from an old commit"
cmd = "git restore --source=<commit> <file>"

[[group.section.command]]
note = "Finds unreachable commits"
cmd = "git fsck --lost-found"

[[group.section]]
title = "Search History"
aliases = ["search git commit history", "find git commit by message", "git log file history"]

[[group.section.command]]
note = "Finds commits that added or removed text"
cmd = "git log -S\"<text>\""

[[group.section.command]]
note = "Finds commits by message"
cmd = "git log --grep=\"<text>\""

[[group.section.command]]
note = "Shows commits by one author"
cmd = "git log --author=\"<name>\""

[[group.section.command]]
note = "Shows the history of one file"
cmd = "git log -- <file>"

[[group.section.command]]
note = "Shows a file's history across renames"
cmd = "git log --follow -- <file>"

[[group.section.command]]
note = "Shows who changed specific lines"
cmd = "git blame -L <start>,<end> <file>"

[[group.section.command]]
note = "Counts commits per author"
cmd = "git shortlog -sn"

[[group]]
title = "Configuration"

[[group.section]]
title = "Git Config Tweaks"
aliases = ["configure git pull rebase", "set git default branch", "set git commit editor"]

[[group.section.command]]
note = "Sets main as the default branch name"
cmd = "git config --global init.defaultBranch main"

[[group.section.command]]
note = "Makes git pull rebase by default"
cmd = "git config --global pull.rebase true"

[[group.section.command]]
note = "Sets the upstream automatically on first push"
cmd = "git config --global push.autoSetupRemote true"

[[group.section.command]]
note = "Sets your commit message editor"
cmd = "git config --global core.editor \"<editor>\""

[[group.section.command]]
note = "Saves credentials to a file"
cmd = "git config --global credential.helper store"

[[group.section.command]]
note = "Creates a git shortcut"
cmd = "git config --global alias.<name> \"<command>\""

[[group.section.command]]
note = "Normalizes line endings on commit"
cmd = "git config --global core.autocrlf input"

[[group.section.command]]
note = "Opens your global config file"
cmd = "git config --global --edit"

[[group.section]]
title = "Ignore Files & Untrack"
aliases = ["untrack git ignored file", "apply gitignore to tracked files", "find git ignore rule"]

[[group.section.command]]
note = "Stops tracking a file but keeps it on disk"
cmd = "git rm --cached <file>"

[[group.section.command]]
note = "Untracks everything so .gitignore can apply"
cmd = "git rm -r --cached ."

[[group.section.command]]
note = "Shows which rule ignores a file"
cmd = "git check-ignore -v <file>"

[[group.section.command]]
note = "Shows ignored files in the status"
cmd = "git status --ignored"

[[group.section.command]]
note = "Deletes untracked and ignored files for good"
cmd = "git clean -fdx"
