tool = "apt"
name = "apt (Debian & Ubuntu)"
category = "Package Managers"
order = 1
aliases = ["dpkg", "ubuntu", "debian"]
platforms = ["linux"]
draft = false

[[group]]
title = "Everything apt"

[[group.section]]
title = "Install & Remove"
aliases = ["apt install package", "apt remove package", "ubuntu package install"]

[[group.section.command]]
note = "Refreshes the package list"
cmd = "sudo apt update"

[[group.section.command]]
note = "Installs a package"
cmd = "sudo apt install <pkg>"

[[group.section.command]]
note = "Removes a package"
cmd = "sudo apt remove <pkg>"

[[group.section.command]]
note = "Removes a package and its config files"
cmd = "sudo apt purge <pkg>"

[[group.section.command]]
note = "Removes packages nothing needs anymore"
cmd = "sudo apt autoremove"

[[group.section]]
title = "Update the System"
aliases = ["apt update system", "apt upgrade packages", "update ubuntu packages"]

[[group.section.command]]
note = "Installs available updates"
cmd = "sudo apt upgrade"

[[group.section.command]]
note = "Upgrades and handles changing dependencies"
cmd = "sudo apt full-upgrade"

[[group.section.command]]
note = "Lists packages with updates"
cmd = "apt list --upgradable"

[[group.section.command]]
note = "Clears the downloaded package cache"
cmd = "sudo apt clean"

[[group.section]]
title = "Search & Inspect"
aliases = ["apt search package", "show apt package", "list installed ubuntu packages"]

[[group.section.command]]
note = "Searches for packages"
cmd = "apt search <term>"

[[group.section.command]]
note = "Shows a package's details"
cmd = "apt show <pkg>"

[[group.section.command]]
note = "Lists installed packages"
cmd = "apt list --installed"

[[group.section.command]]
note = "Lists the files a package installed"
cmd = "dpkg -L <pkg>"

[[group.section.command]]
note = "Finds which package owns a file"
cmd = "dpkg -S <file>"

[[group.section.command]]
note = "Installs a .deb file"
cmd = "sudo dpkg -i <file.deb>"

[[group.section.command]]
note = "Adds a PPA repository"
cmd = "sudo add-apt-repository ppa:<name>"
