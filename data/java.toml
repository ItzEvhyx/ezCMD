tool = "java"
name = "Java"
category = "Languages & Package Tools"
order = 8
aliases = ["javac", "jar", "jshell", "jdk"]
draft = false

[[group]]
title = "Everything Java"

[[group.section]]
title = "Compile & Run"
aliases = ["compile java code", "run java program", "java jshell"]

[[group.section.command]]
note = "Prints the Java runtime version"
cmd = "java -version"

[[group.section.command]]
note = "Prints the compiler version"
cmd = "javac -version"

[[group.section.command]]
note = "Compiles a Java file"
cmd = "javac <File.java>"

[[group.section.command]]
note = "Runs a compiled class"
cmd = "java <ClassName>"

[[group.section.command]]
note = "Compiles and runs a single source file"
cmd = "java <File.java>"

[[group.section.command]]
note = "Runs a JAR file"
cmd = "java -jar <app.jar>"

[[group.section.command]]
note = "Opens an interactive Java prompt"
cmd = "jshell"

[[group.section]]
title = "Packaging & Classpath"
aliases = ["create java jar", "java classpath", "package java application"]

[[group.section.command]]
note = "Creates a JAR file"
cmd = "jar cf <app.jar> <files>"

[[group.section.command]]
note = "Lists the contents of a JAR"
cmd = "jar tf <app.jar>"

[[group.section.command]]
note = "Runs a class with a classpath"
cmd = "java -cp <classpath> <ClassName>"

[[group.section.command]]
note = "Compiles into an output folder"
cmd = "javac -d <out-dir> <files>"

[[group.section.command]]
note = "Runs with a maximum memory size"
cmd = "java -Xmx<size> -jar <app.jar>"
