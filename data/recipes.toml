# Focused answers used by normal `ezcmd <query>` searches.  The existing tool
# sections are retained as workflow recipes by the recommender, which keeps the
# help browser and multi-step guides intact.

[[recipe]]
id = "next.create"
tool = "nextjs"
kind = "compose"
title = "Create a Next.js Project"
action = "create"
object = "project"
triggers = ["create next app", "make nextjs app", "new nextjs project", "make next project", "start nextjs project", "start next app"]
tags = ["scaffold", "react", "web"]
checked = "2026-10"
base = "{pkg.exec} create-next-app@latest <project-name>"
note = "Scaffolds a new Next.js project"
next = ["cd <project-name>", "{pkg.run} dev"]

[[recipe.option]]
id = "typescript"
match = ["typescript", "ts"]
add = "--typescript"
group = "language"

[[recipe.option]]
id = "javascript"
match = ["javascript", "js"]
add = "--javascript"
group = "language"

[[recipe.option]]
id = "tailwind"
match = ["tailwind", "tailwindcss", "tailwind css"]
add = "--tailwind"

[[recipe.option]]
id = "eslint"
match = ["eslint", "lint"]
add = "--eslint"
suggest = true

[[recipe.option]]
id = "src"
match = ["src dir", "src folder"]
add = "--src-dir"
suggest = true

[[recipe]]
id = "git.undo-last-commit"
tool = "git"
kind = "single"
title = "Undo the Last Commit"
action = "undo"
object = "commit"
triggers = ["undo last commit", "revert last commit", "remove last commit", "uncommit"]
tags = ["rollback", "history"]
checked = "2026-10"

[recipe.primary]
cmd = "git reset --soft HEAD~1"
note = "Undoes the commit and keeps changes staged"

[[recipe.variant]]
cmd = "git reset HEAD~1"
when = "Keep your changes but unstage them"
note = "Undoes the last commit"

[[recipe.variant]]
cmd = "git revert HEAD"
when = "Already pushed? Adds a new commit that cancels it"
note = "Reverts the latest commit safely"

[[recipe.variant]]
cmd = "git reset --hard HEAD~1"
when = "Undo the commit and throw away your changes"
match = ["discard", "hard", "delete changes", "throw away"]
note = "Discards the commit and working changes"
risk = "danger"
warn = "Uncommitted and undone work is lost and usually cannot be recovered."

[[recipe]]
id = "git.push-commit"
